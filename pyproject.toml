[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facepipe"
version = "0.1.0"
description = "Open-source facial motion capture that speaks the iFacialMocap protocols (FMV3 and the legacy text protocol) from any camera."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FacePipe contributors" }]
dependencies = [
  "mediapipe>=1.0",
  "opencv-python>=4.9",
  "numpy>=1.24",
  "pillow>=10",
]

[project.scripts]
facepipe = "facepipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
