[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "facepipe"
version = "0.2.0"
description = "Facial motion capture bridge for FMV3, iFacialMocap text, and VMC from a webcam or browser camera."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "FacePipe contributors" }]
dependencies = [
  "mediapipe>=1.0",
  "opencv-contrib-python>=4.9",
  "numpy>=1.24",
  "pillow>=10",
]

[project.scripts]
facepipe = "facepipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facepipe = ["web_assets/*.html", "web_assets/*.js", "web_assets/*.task",
            "web_assets/vendor/*.mjs", "web_assets/vendor/*.txt",
            "web_assets/vendor/*.md",
            "web_assets/vendor/wasm/*.js", "web_assets/vendor/wasm/*.wasm"]
