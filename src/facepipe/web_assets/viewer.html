<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FacePipe viewer</title>
  <style>
    body{font-family:system-ui;background:#111;color:#eee;margin:0;padding:16px}
    h1{font-size:18px;margin:0 0 8px}
    .grid{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:16px;align-items:start}
    canvas{background:#1b1b1b;border:1px solid #333;border-radius:8px;width:100%}
    .bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;align-content:start}
    .bar{background:#222;border-radius:6px;padding:6px}
    .bar b{display:block;font-size:11px;color:#999;font-weight:400}
    .bar span{display:block;height:6px;background:#3b8;border-radius:3px;margin-top:4px}
    .meta{color:#aaa;font-size:12px;margin-bottom:10px}
    input{padding:6px;margin-bottom:10px}
    a{color:#8ed}
  </style>
</head>
<body>
  <h1>FacePipe live viewer</h1>
  <label>Pairing token <input id="token" type="password" autocomplete="off"></label>
  <a href="/capture">Open camera capture</a>
  <div class="meta" id="meta">connecting...</div>
  <div class="grid"><canvas id="mesh" width="320" height="320"></canvas><div class="bars" id="bars"></div></div>
  <script type="module" src="/assets/viewer.js"></script>
</body>
</html>
