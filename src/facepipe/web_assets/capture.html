<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FacePipe camera</title>
  <style>
    body { font: 16px system-ui; max-width: 720px; margin: 0 auto; padding: 20px; background: #111; color: #f4f4f4; }
    video { width: 100%; max-height: 58vh; object-fit: contain; background: #222; border-radius: 12px; transform: scaleX(-1); }
    label { display: block; margin: 12px 0; }
    input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 4px; }
    button { font: inherit; padding: 10px 18px; margin-right: 8px; }
    #status { min-height: 2em; color: #8ed; }
    small { color: #bbb; }
  </style>
</head>
<body>
  <h1>FacePipe camera</h1>
  <p>Track your face here and send motion data to FacePipe. Video stays on this device.</p>
  <label>Pairing token <small>(needed for private LAN access)</small>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
  </label>
  <button id="model-test">Check model</button><button id="start">Start camera</button><button id="stop" disabled>Stop</button>
  <p id="status" role="status">Ready</p>
  <video id="camera" playsinline autoplay muted></video>
  <p><small>The preview is mirrored for convenience; tracking uses the original camera frame so left and right retain their subject-side meaning.</small></p>
  <script type="module" src="/assets/capture.js"></script>
</body>
</html>
